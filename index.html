// ---------- public-site routing ----------
// The marketing site lives at these URLs and is reachable without signing in.
// Authenticated role portals live at /student, /mentor, and /admin.
const SITE_ROUTES = {
  "/":         { key:"home",     build:homeHTML },
  "/sign-in":  { key:"signin",   build:()=>authPageHTML("signin") },
  "/register": { key:"register", build:()=>authPageHTML("signup") },
  "/contact":  { key:"contact",  build:contactHTML },
  "/faq":      { key:"faq",      build:faqHTML },
  "/privacy-policy": { key:"privacy", build:privacyHTML },
};
function currentPath(){ return location.pathname.replace(/\/+$/,"").toLowerCase()||"/"; }
// Navigate to a real URL, push history, and re-render. Used by every public link.
function navTo(path){
  const clean=path.replace(/\/+$/,"").toLowerCase()||"/";
  if(currentPath()!==clean) history.pushState({},"",path);
  render(); window.scrollTo(0,0);
}

function render(){
  const app=document.getElementById("app");
  const path=currentPath();

  // A temporary password from an admin reset must be replaced first.
  if(state.user?.profile?.mustChangePassword&&(isAdminPath()||path==="/mentor"||path==="/student"||path==="/app")){ app.innerHTML=plForcedPasswordHTML(); return; }
  if(state.user) plStartInbox();
  if(isAdminPath()){
    if(!state.user || state.user.role!=="admin"){ app.innerHTML=adminLandingHTML(); return; }
    app.innerHTML=shellHTML();
    document.getElementById("scrim").onclick=closeNav;
    routeView();
    return;
  }

  if(path==="/mentor"){
    if(!state.user){ navTo("/sign-in"); return; }
    if(state.user.role!=="mentor"){ navTo(appPathFor(state.user)); return; }
    if(state.user.status!=="active"){ app.innerHTML=mentorActivationHTML(); return; }
    app.innerHTML=shellHTML();
    document.getElementById("scrim").onclick=closeNav;
    routeView();
    return;
  }

  if(path==="/student"||path==="/app"){
    if(!state.user){ navTo("/sign-in"); return; }
    if(state.user.role!=="student"){ navTo(appPathFor(state.user)); return; }
    app.innerHTML=shellHTML();
    document.getElementById("scrim").onclick=closeNav;
    routeView();
    return;
  }

  // Public marketing site (home / sign-in / register / contact / FAQ).
  const route=SITE_ROUTES[path]||SITE_ROUTES["/"];
  app.innerHTML=siteHTML(route.key, route.build());
  if(route.key==="signin"||route.key==="register"){
    initOAuth();
    if(PENDING_AUTH_ERR){ authErr(PENDING_AUTH_ERR); PENDING_AUTH_ERR=""; }
  }
}

          <button type="submit" class="btn btn-primary btn-block">${svg("arr","ic-sm")} Send message</button>
        </form>
        <div class="form-ok" id="contactOk">

async function submitContact(e){
  e.preventDefault();
  const form=e.target;
  const err=document.getElementById("contactErr"); err.classList.remove("show");
  try{
    const r=await fetch("/__forms.html",{ method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body:new URLSearchParams(new FormData(form)).toString() });
    if(!r.ok) throw new Error("status "+r.status);
    form.style.display="none";
    document.getElementById("contactOk").classList.add("show");
  }catch(ex){
    err.textContent="Could not send your message. Please try again, or email us directly.";
    err.classList.add("show");
  }
  return false;
}

function periodCard(label,period,icon){

function deadlineText(value){
  const due=new Date(value), diff=due.getTime()-Date.now();
  if(diff<=0) return `Past due · ${due.toLocaleString()}`;
  const hours=Math.ceil(diff/3600000);
  return hours<24?`Due in ${hours} hour${hours===1?"":"s"}`:`Due in ${Math.ceil(hours/24)} day${Math.ceil(hours/24)===1?"":"s"} · ${due.toLocaleDateString()}`;
}

  catch(e){ toast(e.message); }
}

// A lesson is a YouTube video played inside our own page — the embed is a

// with the same section / domain / SAT-skill taxonomy as the question bank.
let LN={rows:[],filter:{q:"",section:"",category:"",subcategory:"",status:""},editing:null,lesson:null,replyTo:null};
function canAuthorLessons(){ return state.user.role==="admin"||state.user.role==="mentor"; }
function youtubeId(raw){
  const value=String(raw||"").trim();
  if(/^[\w-]{11}$/.test(value)) return value;
  let url;
  try{ url=new URL(value.startsWith("http")?value:"https://"+value); }catch{ return ""; }
  const host=url.hostname.replace(/^www\./,"");
  if(host==="youtu.be"){ const id=url.pathname.slice(1).split("/")[0]; return /^[\w-]{11}$/.test(id)?id:""; }
  if(!/^(?:m\.)?youtube(?:-nocookie)?\.com$/.test(host)) return "";
  const v=url.searchParams.get("v");
  if(v&&/^[\w-]{11}$/.test(v)) return v;
  const m=url.pathname.match(/^\/(?:embed|shorts|v|live)\/([\w-]{11})/);
  return m?m[1]:"";
}
function lessonThumb(id){ return `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`; }
// The player lives on our page: privacy-mode host, no related videos, no

  if(!lesson.videoId) return `<div class="empty" style="padding:1.6rem"><p>This lesson has no valid YouTube link yet.</p></div>`;
  const src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(lesson.videoId)}?rel=0&modestbranding=1&playsinline=1`;
  return `<div class="player-frame"><iframe src="${src}" title="${esc(lesson.title)}" loading="lazy"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`;
}
function lessonTagsHTML(lesson){

    ${lesson.subcategory?`<span class="pill pill-muted">${esc(lesson.subcategory)}</span>`:""}
    <span class="pill ${dc}">${esc(dl)}</span>

}

    <div class="field"><label>SAT skill</label><select onchange="LN_setFilter('subcategory',this.value)" ${skills.length?"":"disabled"}>

    ${canAuthorLessons()?`<div class="field"><label>Visibility</label><select onchange="LN_setFilter('status',this.value)">
      <option value="">Published &amp; drafts</option>

      <option value="draft" ${f.status==="draft"?"selected":""}>Drafts only</option></select></div>`:""}
  </div>`;
}
function LN_setFilter(key,value){
  LN.filter[key]=value;
  if(key==="section"){ LN.filter.category=""; LN.filter.subcategory=""; }
  if(key==="category") LN.filter.subcategory="";
  if(key!=="q"){ const bar=document.getElementById("lnBar"); if(bar) bar.innerHTML=lessonFilterBarHTML(); }
  renderLessonList();
}
function filteredLessons(){
  const f=LN.filter;
  let list=LN.rows.slice();
  if(f.section) list=list.filter(l=>l.section===f.section);
  if(f.category) list=list.filter(l=>l.category===f.category);
  if(f.subcategory) list=list.filter(l=>l.subcategory===f.subcategory);
  if(f.status) list=list.filter(l=>l.status===f.status);
  if(f.q){
    const term=f.q.trim().toLowerCase();
    list=list.filter(l=>[l.title,l.topic,l.category,l.subcategory,l.author?.displayName,richToText(l.description||"")]
      .some(v=>String(v??"").toLowerCase().includes(term)));
  }
  return list;
}

function lessonCommentAuthor(id){

function lessonCommentsHTML(comments){
  const roots=comments.filter(c=>!c.parentId);
  if(!roots.length) return `<p class="umeta">No comments yet.</p>`;
  const replies=id=>comments.filter(c=>c.parentId===id);
  const card=(c,isReply)=>{
    const mine=c.author?.id===state.user.id;
    const canDelete=canAuthorLessons()||mine;
    let when=""; try{ when=c.createdAt?new Date(c.createdAt).toLocaleString():""; }catch{}
    return `<div class="comment ${isReply?"reply":""}">
      <div class="cmeta"><b style="color:var(--ink)">${esc(c.author?.displayName||"Student")}</b>
        <span class="role-chip ${c.author?.role==="student"?"stu":""}">${esc(c.author?.role||"student")}</span>

        ${!isReply?`<button class="btn btn-ghost btn-xs" onclick="LN_reply(${c.id})">Reply</button>`:""}
        ${canDelete?`<button class="btn btn-ghost btn-xs" onclick="deleteLessonComment(${c.id})">Delete</button>`:""}
      </div>
      <div class="cbody">${esc(c.body)}</div>
      ${isReply?"":replies(c.id).map(r=>card(r,true)).join("")}</div>`;
  };
  return roots.map(c=>card(c,false)).join("");
}

      <option value="">All types</option>
      <option value="mcq" ${f.type==="mcq"?"selected":""}>Multiple choice</option>
      <option value="spr" ${f.type==="spr"?"selected":""}>Grid-in (SPR)</option></select></div>
  </div>`;
}
function filterQuestions(rows,f){
  let list=rows.slice();
  if(f.section) list=list.filter(q=>q.section===f.section);
  if(f.category) list=list.filter(q=>q.category===f.category);
  if(f.subcategory) list=list.filter(q=>q.subcategory===f.subcategory);
  if(f.type) list=list.filter(q=>(q.type||"mcq")===f.type);
  if(f.difficulty){
    const d=f.difficulty;
    list=list.filter(q=>d==="easy"?q.difficulty<=2:d==="medium"?q.difficulty===3:d==="hard"?q.difficulty>=4:q.difficulty===Number(d));
  }
  if(f.q){
    const term=f.q.trim().toLowerCase().replace(/^#/,"");
    if(term) list=list.filter(q=>String(q.id)===term||questionSearchText(q).includes(term));
  }
  return list;
}
// Reset the dependent filters when a parent changes, so a stale skill can never
// hide every question.
function applyFilterChange(filter,key,value){
  filter[key]=value;
  if(key==="section"){ filter.category=""; filter.subcategory=""; }
  if(key==="category") filter.subcategory="";
  return key!=="q"; // true when the bar itself has to be redrawn
}
function questionMetaLine(q){
  const [label]=DIFF[q.difficulty]||DIFF[3];
  return `${esc(SECTIONS[q.section]?.label||q.section)} · ${esc(q.category)}${q.subcategory?` · ${esc(q.subcategory)}`:""} · level ${q.difficulty} (${label}) · ${(q.type||"mcq")==="spr"?"grid-in":"multiple choice"}${q.questionImage?" · has graphic":""}`;
}

// ---------- practice engine ----------
// ---------- in-progress quiz persistence ----------
// The question a student is on is mirrored to sessionStorage on every change,
// so a re-render, a back/forward, or an accidental reload lands them on the
// exact question they were on instead of Question 1. Scoped per user and per
// tab; full-length tests also keep a per-attempt snapshot in localStorage (see
// the test section) because those must survive the tab closing.
const activeQuizKey=()=>`fnf_active_quiz_${state.user?.key||"anon"}`;
function readActiveQuiz(){ try{ return JSON.parse(sessionStorage.getItem(activeQuizKey())||"null"); }catch{ return null; } }
function writeActiveQuiz(value){ try{ sessionStorage.setItem(activeQuizKey(),JSON.stringify({...value,savedAt:Date.now()})); }catch{} }
function clearActiveQuiz(){ try{ sessionStorage.removeItem(activeQuizKey()); }catch{} }
const PRACTICE_CTX_KEYS=["section","category","subcategory","practiceSet","practiceLabel","practiceMode","practiceReturn","practiceLimit"];
// A custom set (task, review queue) is the same list P already holds, so only a
// marker is stored for it and the list is put back from P on restore.
function practiceCtx(){
  const ctx=Object.fromEntries(PRACTICE_CTX_KEYS.map(k=>[k,state[k]??null]));
  ctx.practiceSet=Array.isArray(state.practiceSet)?true:null;
  return ctx;
}
function samePracticeCtx(ctx){
  return !!ctx&&["section","category","subcategory","practiceLabel","practiceMode","practiceReturn"].every(k=>(ctx[k]??null)===(state[k]??null));
}
function savePracticeProgress(){
  if(!P||state.view!=="practice") return;
  const {list,idx,correct,mode,returnView,label,answered,sel,result,sid}=P;
  writeActiveQuiz({kind:"practice",ctx:practiceCtx(),P:{list,idx,correct,mode,returnView,label,answered,sel,result,sid}});
}
// Called once on boot: put the router back on whatever quiz this tab was in.
function restoreActiveQuiz(){
  if(state.user?.role!=="student") return;
  if(!["/student","/app"].includes(currentPath())) return;
  const saved=readActiveQuiz();
  if(saved?.kind==="practice"&&saved.P?.list?.length){
    Object.assign(state,saved.ctx,{view:"practice",practiceSet:saved.ctx?.practiceSet?saved.P.list:null});
  }
  else if(saved?.kind==="test"&&saved.attemptId){ Object.assign(state,{view:"testsit",attemptId:saved.attemptId}); }
}
window.addEventListener("pagehide",()=>savePracticeProgress());

let P=null;
const practiceReturnLabel=v=>v==="tasks"?"My Tasks":v==="challenge"?"Challenging Questions":"Review";
async function startPractice(section,category,subcategory=null){
  try{
    const usage=await api("usage");
    if(!usage.enrolled&&usage.remaining<=0){ toast(`Daily Question Bank limit (${usage.limit}) reached. It resets ${new Date(usage.resetsAt).toLocaleString()}.`); go("home"); return; }
    state.practiceLimit=usage.enrolled?null:usage.remaining;
  }catch{}
  state.practiceSet=null; state.practiceMode="bank"; state.practiceReturn="bank";
  clearActiveQuiz();
  go("practice",{section,category,subcategory});
}
async function viewPractice(){
  const custom=Array.isArray(state.practiceSet);
  const s=SECTIONS[state.section];
  const practiceLabel=custom?state.practiceLabel:(state.subcategory||state.category);
  crumbs(custom?[{label:practiceReturnLabel(state.practiceReturn),onclick:`go('${state.practiceReturn}')`},{label:practiceLabel}]:[
    {label:"Question Bank",onclick:"go('bank',{section:null,category:null,subcategory:null})"},
    {label:s.label,onclick:`go('bank',{section:'${state.section}',category:null,subcategory:null})`},
    ...(state.subcategory?[{label:state.category,onclick:`go('bank',{section:'${state.section}',category:${JSON.stringify(state.category)},subcategory:null})`}]:[]),
    {label:practiceLabel}
  ]);
  // Same set as the one this tab was already working through? Pick it back up
  // at the same question rather than re-fetching and reshuffling from the top.
  const saved=readActiveQuiz();
  if(saved?.kind==="practice"&&samePracticeCtx(saved.ctx)&&saved.P?.list?.length){
    P={...saved.P,sid:saved.P.sid||newPracticeSid(),idx:Math.min(Math.max(0,saved.P.idx|0),saved.P.list.length-1)};
    renderQuestion(true);
    return;
  }
  loading();
  let list=custom?[...state.practiceSet]:[];
  if(!custom){
    const subQuery=state.subcategory?`&subcategory=${encodeURIComponent(state.subcategory)}`:"";
    try{ list=await api(`questions?section=${encodeURIComponent(state.section)}&category=${encodeURIComponent(state.category)}${subQuery}`);}catch(e){}
    if(state.practiceLimit!=null) list=list.slice(0,state.practiceLimit);
  }
  if(!list.length){
    $c().innerHTML=`<div class="empty fade"><div class="ei">${svg("book")}</div>
      <p>No questions in <b>${esc(practiceLabel)}</b> yet.<br>Check back once the studio adds some.</p>
      <button class="btn btn-ghost" onclick="go('${custom?state.practiceReturn:"bank"}'${custom?"":`,{section:'${state.section}',category:${JSON.stringify(state.category).replace(/"/g,'&quot;')},subcategory:null}`})">${svg("back","ic-sm")} Back</button></div>`;
    return;
  }
  // Challenging Questions sets keep their authored order; everything else is shuffled.
  if(state.practiceMode!=="challenge") list=list.sort(()=>Math.random()-0.5);
  P={list,idx:0,answered:false,correct:0,sel:null,result:null,mode:state.practiceMode||"bank",returnView:state.practiceReturn||"bank",label:practiceLabel,sid:newPracticeSid()};
  renderQuestion();
}
// Each practice session gets its own id, so the docked Desmos calculator (its
// expressions, graph and split) lasts exactly as long as the session.
function newPracticeSid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
// `restore` keeps the answer state that came back from storage instead of
// starting the question fresh.
function renderQuestion(restore=false){
  const q=P.list[P.idx];
  if(!restore){ P.answered=false; P.sel=null; P.result=null; }
  const qSection=SECTIONS[q.section]||{label:q.section};
  const pct=Math.round((P.idx/P.list.length)*100);
  const [dl,dc]=DIFF[q.difficulty]||DIFF[3];
  let answerArea;
  if(q.type==="spr"){
    answerArea=`<input class="spr-input" id="sprIn" placeholder="Type your answer" oninput="P.sel=this.value;document.getElementById('checkBtn').disabled=!this.value.trim()" onchange="savePracticeProgress()" onkeydown="if(event.key==='Enter'&&this.value.trim())checkAnswer()"/>
      <p class="mathhint" style="margin-top:.45rem">Type fractions as <b>3/4</b> and decimals as <b>0.75</b> — either form is accepted.</p>`;
  } else {
    answerArea=`<div class="choices">`+["A","B","C","D"].map(l=>q.choices&&q.choices[l]!=null?
      `<button class="choice" data-l="${l}" onclick="pickChoice('${l}')"><span class="ltr">${l}</span><span class="ct">${mathText(q.choices[l])}${questionMediaHTML(q.choiceImages?.[l],`Answer choice ${l}`,"choice")}</span></button>`:"").join("")+`</div>`;
  }
  $c().innerHTML=`<div class="q-shell fade">
    <div class="q-topline">
      <span class="pill pill-sec">${esc(qSection.label)}</span>
      <span class="pill ${dc}">${dl}</span>
      <span class="pill pill-muted">${esc(q.category)}</span>
      ${q.subcategory?`<span class="pill pill-muted">${esc(q.subcategory)}</span>`:""}
      <span style="flex:1"></span>
      ${q.section==="math"?`<button class="btn btn-ghost btn-sm" id="practiceCalcBtn" onclick="toggleDesmosFloat()">${svg("calc","ic-sm")} Calculator</button>`:""}
      <span style="font-family:var(--mono);font-size:.8rem;color:var(--ink3)">${P.idx+1} / ${P.list.length}</span>
    </div>
    <div class="q-progress"><i style="width:${pct}%"></i></div>
    <div class="q-card" style="margin-top:1rem">
      ${q.passage?`<div class="q-passage">${mathText(q.passage)}</div>`:""}
      ${questionMediaHTML(q.questionImage,"Question graphic")}
      <div class="q-prompt">${mathText(q.prompt)}</div>
      <div id="answerArea">${answerArea}</div>
      <div id="explainArea"></div>
      <div class="q-actions">
        <span class="feedback-tag" id="fbTag"></span>
        <button class="btn btn-ghost btn-sm" id="saveQBtn" onclick="toggleSavedQuestion(${q.id})">${svg("save","ic-sm")} Save for review</button>${plReportButtonHTML(q.id,P.mode==="challenge"?"challenge":String(P.mode).startsWith("task:")?"task":P.mode==="review"?"review":"bank")}<span class="spacer"></span>
        <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()" ${q.type==="spr"?"disabled":"disabled"}>Check answer</button>
        <button class="btn btn-ghost" id="nextBtn" style="display:none" onclick="nextQuestion()">${P.idx+1<P.list.length?"Next question":"Finish"} ${svg("arr","ic-sm")}</button>
      </div>
    </div>
  </div>`;
  if(restore){
    if(P.answered&&P.result) paintPracticeResult(q,P.result);
    else if(P.sel&&q.type==="spr"){ const inp=document.getElementById("sprIn"); inp.value=P.sel; document.getElementById("checkBtn").disabled=!P.sel.trim(); }
    else if(P.sel){ const l=P.sel; P.sel=null; pickChoice(l); }
  }
  // Shared Desmos layout: a calculator from another session is retired; on a
  // non-Math question it is put away (work kept) and comes back on the next
  // Math question; otherwise the docked split is re-laid around the new question.
  if(desmosFloatEl&&DF.ctx!==dfContext()) desmosDestroy();
  if(desmosFloatEl&&DF.open&&q.section!=="math") desmosHide();
  dfAfterRender();
  savePracticeProgress();
}
async function toggleSavedQuestion(questionId){
  const btn=document.getElementById("saveQBtn");
  try{ await api("saved-questions",{method:"POST",body:JSON.stringify({questionId})}); if(btn){btn.disabled=true;btn.textContent="Saved for review";} toast("Question saved for review"); }
  catch(e){ toast(e.message); }
}
function pickChoice(l){
  if(P.answered) return;
  P.sel=l;
  document.querySelectorAll(".choice").forEach(c=>c.classList.toggle("sel",c.dataset.l===l));
  document.getElementById("checkBtn").disabled=false;
  savePracticeProgress();
}
// Students never receive the answer key before answering: the server grades
// the attempt and returns the correct answer and explanation with the result.
async function checkAnswer(){
  if(!P||P.answered||P.checking) return;
  const q=P.list[P.idx];
  let selected;
  if(q.type==="spr"){
    selected=(document.getElementById("sprIn").value||"").trim();
    if(!selected) return;
  } else {
    if(!P.sel) return;
    selected=P.sel;
  }
  const btn=document.getElementById("checkBtn"), btnLabel=btn.innerHTML;
  const lockInputs=on=>{
    const inp=document.getElementById("sprIn"); if(inp) inp.disabled=on;
    document.querySelectorAll("#answerArea .choice").forEach(c=>c.disabled=on);
  };
  P.checking=true; btn.disabled=true; btn.textContent="Checking…"; lockInputs(true);
  let graded=null, error=null;
  try{ graded=await gradeAnswer(q,selected,P.mode); }catch(e){ error=e; }
  P.checking=false;
  // The student moved on (or left practice) while the request was in flight.
  if(state.view!=="practice"||!P||P.list[P.idx]!==q||P.answered) return;
  if(!graded){
    // Leave the question unanswered so it can be checked again.
    toast(error?.message||"Could not check your answer. Try again.");
    lockInputs(false); btn.innerHTML=btnLabel; btn.disabled=false;
    return;
  }
  const result={selected,...graded};
  P.answered=true; P.sel=selected; P.result=result; if(result.correct)P.correct++;
  paintPracticeResult(q,result);
  savePracticeProgress();
}
// Show the graded state of the current question — after checking it, or when
// a restored session lands on a question that was already answered. The key
// comes from the stored result (sessions saved before the key was stripped
// from the question list fall back to the question itself).
function paintPracticeResult(q,result){
  const {selected,correct}=result;
  const answer=result.answer??q.answer, explanation=result.explanation??q.explanation;
  if(q.type==="spr"){
    const inp=document.getElementById("sprIn"); inp.value=selected; inp.disabled=true;
    inp.style.borderColor=correct?"var(--mint)":"var(--red)";
  } else {
    document.querySelectorAll(".choice").forEach(c=>{
      c.disabled=true;
      if(c.dataset.l===answer) c.classList.add("right");
      else if(c.dataset.l===selected) c.classList.add("wrong");
      c.classList.remove("sel");
    });
  }
  document.getElementById("fbTag").className="feedback-tag "+(correct?"ok":"no");
  document.getElementById("fbTag").innerHTML=(correct?svg("check","ic-sm")+"Correct":svg("x","ic-sm")+"Not quite");
  document.getElementById("explainArea").innerHTML=`<div class="explain ${correct?"":"bad"}">
    <h4>${correct?"Why this works":"Correct answer: "+mathText(answer??"")}</h4>
    <p>${mathText(explanation||"—")}</p></div>`;
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-flex";
}
function nextQuestion(){
  if(P.idx+1<P.list.length){ P.idx++; renderQuestion(); window.scrollTo(0,0); }
  else finishPractice();
}
function finishPractice(){
  clearActiveQuiz();
  if(desmosFloatEl) desmosDestroy();
  const total=P.list.length, c=P.correct, pct=Math.round((c/total)*100);
  const tone=pct>=80?"ok":pct>=50?"":"no";
  if(P.returnView!=="bank"){
    $c().innerHTML=`<div class="q-shell fade"><div class="q-card" style="text-align:center;padding:2.4rem"><div class="badge-ic tone-gold" style="margin:0 auto 1.1rem;width:54px;height:54px">${svg("trophy")}</div><h1 style="font-family:var(--disp);font-size:2rem;font-weight:800">Set complete</h1><p style="color:var(--ink2);margin:.4rem 0 1.2rem">${esc(P.label)}</p><div style="font-family:var(--disp);font-size:3.4rem;font-weight:800;color:var(--mint)">${pct}%</div><p style="color:var(--ink2);margin-bottom:1.8rem">${c} of ${total} correct</p><button class="btn btn-primary" onclick="go('${P.returnView}')">Return to ${practiceReturnLabel(P.returnView)}</button></div></div>`;
    return;
  }
  $c().innerHTML=`<div class="q-shell fade">
    <div class="q-card" style="text-align:center;padding:2.4rem">
      <div class="badge-ic ${pct>=80?'tone-ebrw':pct>=50?'tone-gold':''}" style="margin:0 auto 1.1rem;width:54px;height:54px">${svg("trophy")}</div>
      <h1 style="font-family:var(--disp);font-size:2rem;font-weight:800;letter-spacing:-.02em">Set complete</h1>
      <p style="color:var(--ink2);margin:.4rem 0 1.6rem">${esc(state.subcategory||state.category)} · ${esc(SECTIONS[state.section].label)}</p>
      <div style="font-family:var(--disp);font-size:3.4rem;font-weight:800;color:${pct>=80?'var(--mint)':pct>=50?'var(--gold)':'var(--red)'}">${pct}%</div>
      <p style="color:var(--ink2);margin-bottom:1.8rem">${c} of ${total} correct</p>
      <div style="display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="startPractice('${state.section}',${JSON.stringify(state.category).replace(/"/g,'&quot;')},${state.subcategory?JSON.stringify(state.subcategory).replace(/"/g,'&quot;'):"null"})">${svg("rush","ic-sm")} Practice again</button>
        <button class="btn btn-ghost" onclick="go('bank',{section:'${state.section}',category:${JSON.stringify(state.category).replace(/"/g,'&quot;')},subcategory:null})">${svg("back","ic-sm")} Choose another skill</button>
        <button class="btn btn-ghost" onclick="go('profile')">${svg("profile","ic-sm")} View progress</button>
      </div>
    </div></div>`;
}
// Records and grades one answer on the server. The response carries the
// server's verdict plus the question's answer, acceptableAnswers and
// explanation. Throws on a network / API error so the caller can retry.
async function recordAttempt(q,selected,mode){
  return api("attempts",{method:"POST",body:JSON.stringify({
    questionId:q.id, selected:String(selected), mode
  })});
}
// Grade one answer: students through the server (recordAttempt); staff, who
// already hold the key and cannot record attempts, are graded locally.
async function gradeAnswer(q,selected,mode){
  if(state.user?.role!=="student"&&q.answer!==undefined)
    return {correct:q.type==="spr"?sprMatches(selected,q.answer):selected===q.answer,answer:q.answer,explanation:q.explanation||""};
  const row=await recordAttempt(q,selected,mode);
  return {correct:!!row?.correct,answer:row?.answer??null,explanation:row?.explanation||""};
}

let R=null;
function viewRush(){
  crumbs([{label:"Question Rush"}]);
  if(R&&R.active){ renderRushQ(); return; }
  R={active:false,scope:"both",dur:120};
  $c().innerHTML=`<div class="q-shell fade">
    <div class="page-head" style="text-align:center"><h1>Question Rush</h1><p style="margin:.4rem auto 0">Beat the clock. Answer as many as you can — instant feedback, building streaks.</p></div>
    <div class="q-card" style="text-align:center;padding:2rem">
      <div class="badge-ic tone-gold" style="margin:0 auto 1.2rem;width:54px;height:54px">${svg("flame")}</div>
      <p style="font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:.6rem">Section</p>
      <div class="opt-row" id="scopeRow">
        ${[["both","Both"],["math","Math"],["ebrw","EBRW"]].map(([v,l])=>`<button class="opt ${v==='both'?'on':''}" data-scope="${v}" onclick="setScope('${v}')">${l}</button>`).join("")}
      </div>
      <p style="font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin:.4rem 0 .6rem">Time</p>
      <div class="opt-row" id="durRow">
        ${[[60,"60s"],[120,"2 min"],[180,"3 min"]].map(([v,l])=>`<button class="opt ${v===120?'on':''}" data-dur="${v}" onclick="setDur(${v})">${l}</button>`).join("")}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:1rem;max-width:280px;margin-left:auto;margin-right:auto" onclick="beginRush()">${svg("rush","ic-sm")} Start rush</button>
    </div></div>`;
}
function setScope(v){ R.scope=v; document.querySelectorAll("#scopeRow .opt").forEach(o=>o.classList.toggle("on",o.dataset.scope===v)); }
function setDur(v){ R.dur=v; document.querySelectorAll("#durRow .opt").forEach(o=>o.classList.toggle("on",Number(o.dataset.dur)===v)); }
async function beginRush(){
  loading();
  let qp=""; if(R.scope!=="both") qp="?section="+R.scope;
  let list=[],usage={enrolled:true,remaining:null}; try{ [list,usage]=await Promise.all([api("questions"+qp),api("usage")]); }catch{}
  if(!usage.enrolled&&usage.remaining<=0){ toast("Daily 20-question limit reached. Join a class for unlimited practice."); go("home"); return; }
  if(!usage.enrolled) list=list.slice(0,usage.remaining);
  if(!list.length){ $c().innerHTML=`<div class="empty fade"><div class="ei">${svg("flame")}</div><p>No questions available to rush yet.</p><button class="btn btn-ghost" onclick="go('rush')">${svg("back","ic-sm")} Back</button></div>`; return; }
  R={...R,active:true,pending:false,list:list.sort(()=>Math.random()-0.5),idx:0,score:0,streak:0,best:0,answered:0,timeLeft:R.dur};
  R.timer=setInterval(()=>{ R.timeLeft--; updateRushTimer(); if(R.timeLeft<=0) endRush(); },1000);
  renderRushQ();
}
function renderRushQ(){
  if(R.idx>=R.list.length){ endRush(); return; }
  const q=R.list[R.idx];
  let area;
  if(q.type==="spr"){
    area=`<input class="spr-input" id="rsprIn" placeholder="Type & press Enter" onkeydown="if(event.key==='Enter')rushAnswer(this.value)"/>`;
  } else {
    area=`<div class="choices">`+["A","B","C","D"].map(l=>q.choices&&q.choices[l]!=null?
      `<button class="choice" data-l="${l}" onclick="rushAnswer('${l}')"><span class="ltr">${l}</span><span class="ct">${mathText(q.choices[l])}${questionMediaHTML(q.choiceImages?.[l],`Answer choice ${l}`,"choice")}</span></button>`:"").join("")+`</div>`;
  }
  $c().innerHTML=`<div class="q-shell fade">
    <div class="rush-hero">
      <div class="rush-timer ${R.timeLeft<=10?'low':''}" id="rushTimer">${fmtTime(R.timeLeft)}</div>
      <div class="rush-meta">
        <div class="rm"><div class="n" id="rScore" style="color:var(--mint)">${R.score}</div><div class="l">Score</div></div>
        <div class="rm"><div class="n" id="rStreak" style="color:var(--gold)">${R.streak}</div><div class="l">Streak</div></div>
        <div class="rm"><div class="n" id="rAns">${R.answered}</div><div class="l">Answered</div></div>
      </div>
    </div>
    <div class="q-card">
      <div class="q-topline"><span class="pill pill-sec">${esc(SECTIONS[q.section].label)}</span><span class="pill pill-muted">${esc(q.category)}</span><span style="flex:1"></span>${q.section==="math"?`<button class="btn btn-ghost btn-sm" onclick="toggleDesmosFloat()">${svg("graph","ic-sm")} Desmos</button>`:""}</div>
      ${q.passage?`<div class="q-passage">${mathText(q.passage)}</div>`:""}
      ${questionMediaHTML(q.questionImage,"Question graphic")}
      <div class="q-prompt">${mathText(q.prompt)}</div>
      ${area}
    </div>
    <div style="text-align:center;margin-top:1rem"><button class="btn btn-ghost btn-sm" onclick="endRush()">End rush</button></div>
  </div>`;
  if(q.type==="spr") setTimeout(()=>document.getElementById("rsprIn")?.focus(),30);
}
function updateRushTimer(){ const t=document.getElementById("rushTimer"); if(t){ t.textContent=fmtTime(R.timeLeft); t.classList.toggle("low",R.timeLeft<=10);} }
async function rushAnswer(val){
  if(!R.active||R.pending) return;
  const q=R.list[R.idx];
  const sel=String(val).trim();
  const lockInputs=on=>{
    document.querySelectorAll(".choice").forEach(c=>c.disabled=on);
    const inp=document.getElementById("rsprIn"); if(inp) inp.disabled=on;
  };
  R.pending=true; lockInputs(true);
  let graded=null, error=null;
  try{ graded=await gradeAnswer(q,sel,"rush"); }catch(e){ error=e; }
  R.pending=false;
  if(!R.active||R.list[R.idx]!==q) return;
  if(!graded){
    // Not counted: the same question stays up so it can be answered again.
    toast(error?.message||"Could not check your answer. Try again.");
    lockInputs(false);
    if(q.type==="spr") document.getElementById("rsprIn")?.focus();
    return;
  }
  const correct=graded.correct;
  R.answered++;
  if(correct){ R.score++; R.streak++; R.best=Math.max(R.best,R.streak);} else { R.streak=0; }
  // brief visual feedback
  if(q.type!=="spr"){
    document.querySelectorAll(".choice").forEach(c=>{ c.disabled=true;
      if(c.dataset.l===graded.answer)c.classList.add("right"); else if(c.dataset.l===sel)c.classList.add("wrong"); });
  } else {
    const inp=document.getElementById("rsprIn"); if(inp){inp.disabled=true; inp.style.borderColor=correct?"var(--mint)":"var(--red)";}
  }
  document.getElementById("rScore").textContent=R.score;
  document.getElementById("rStreak").textContent=R.streak;
  document.getElementById("rAns").textContent=R.answered;
  R.idx++;
  setTimeout(()=>{ if(R.active) renderRushQ(); }, 520);
}
function endRush(){
  if(R.timer) clearInterval(R.timer);
  const wasActive=R.active; R.active=false;
  if(!wasActive) return;
  const acc=R.answered?Math.round((R.score/R.answered)*100):0;
  $c().innerHTML=`<div class="q-shell fade"><div class="q-card" style="text-align:center;padding:2.4rem">
    <div class="badge-ic tone-gold" style="margin:0 auto 1.1rem;width:54px;height:54px">${svg("trophy")}</div>

// Admins assemble a test out of modules and pick the questions in each module.
// Students sit it against a clock the server owns. Mentors read the whole thing
// and hand any slice of it back to a class as a task.
function testTimingNote(t){
  return t.perModuleTiming
    ? `Each module is timed separately · ${t.totalMinutes} min in total`
    : `One continuous clock · ${t.totalMinutes} min for the whole test`;
}
function testShape(t){
  return `${t.moduleCount??(t.modules||[]).length} module${(t.moduleCount??(t.modules||[]).length)===1?"":"s"} · ${t.questionCount} question${t.questionCount===1?"":"s"}`;
}
function shuffledIds(ids){
  const a=ids.slice();
  for(let i=a.length-1;i>0;i-=1){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function questionLabel(q){
  return esc(mathPlain(q.prompt||"").slice(0,80))||"(graphic only)";
}
function viewTests(){
  if(state.user.role==="admin"||state.user.role==="mentor") return viewTestsAdmin();
  return viewTestsStudent();
}

async function putModuleQuestions(moduleId,ids){

function moveModuleQuestion(moduleId,idx,dir){
  const m=moduleById(moduleId); if(!m) return;
  const ids=m.questions.map(q=>q.id);
  const to=idx+dir; if(to<0||to>=ids.length) return;
  [ids[idx],ids[to]]=[ids[to],ids[idx]];
  putModuleQuestions(moduleId,ids);
}
function removeModuleQuestion(moduleId,questionId){
  const m=moduleById(moduleId); if(!m) return;
  putModuleQuestions(moduleId,m.questions.filter(q=>q.id!==questionId).map(q=>q.id));

// Bank ids a test already holds — directly (older links) or as a snapshot.
function testBankIds(modules){
  return new Set(modules.flatMap(m=>(m.questions||[]).flatMap(q=>q.source==="TEST_EXCLUSIVE"?[]:[q.id,q.sourceQuestionId])).filter(v=>v!=null));
}

// ── Manual question drawer ──
// Writes a question straight into one module. It is test-only unless the
// "Also copy to General Question Bank" box is ticked.
let TQ=null; // { moduleId, questionId }
function openTestQuestionEditor(moduleId,questionId=null){
  const m=moduleById(moduleId); if(!m) return;
  const existing=questionId?m.questions.find(q=>q.id===questionId):null;
  if(questionId&&!existing) return;
  let q;
  if(existing) q=JSON.parse(JSON.stringify(existing));
  else {
    const category=SECTIONS[m.section].categories[0];
    q={...blankQ(),section:m.section,category,subcategory:(SUBSECTIONS[category]||[])[0]||""};
  }
  TQ={moduleId,questionId};
  const index=TE.test.modules.indexOf(m);
  const fromBank=existing&&existing.source!=="TEST_EXCLUSIVE";
  document.getElementById("tqBack")?.remove();
  const back=document.createElement("div");
  back.className="tq-back"; back.id="tqBack";
  back.innerHTML=`<div class="tq-drawer" role="dialog" aria-modal="true" aria-labelledby="tqTitle">
    <div class="tq-head"><div style="flex:1">
        <h3 id="tqTitle">${svg(existing?"edit":"plus","ic-sm")} ${existing?`Edit test question #${existing.id}`:"Add Manual Question"}</h3>
        <p>Module ${index+1} · ${esc(m.title)}${existing?` · ${questionSourceBadge(existing)}`:""}</p></div>
      <button class="btn btn-ghost btn-xs" onclick="closeTestQuestionEditor()" aria-label="Close">${svg("x","ic-sm")}</button></div>
    <div class="tq-body"><div class="form-grid">
      ${questionFieldsHTML(q)}
      ${existing
        ? `<p class="mathhint">${fromBank?"This question came from the bank. Your changes are saved to this test's copy only — the bank version stays as it is.":"This question belongs to this test only."}</p>`
        : `<label class="tq-toggle"><input type="checkbox" id="tqCopyBank"/> Also copy to General Question Bank</label>
           <p class="mathhint" style="margin-top:-.4rem">Left unticked, the question lives in this test only and never appears in practice or the bank.</p>`}
      <div class="form-error" id="qFormError" style="display:none"></div>
    </div></div>
    <div class="tq-actions">
      <button class="btn btn-ghost" onclick="closeTestQuestionEditor()">Cancel</button>
      <button class="btn btn-primary" id="tqSave" onclick="saveTestQuestion()">${svg("save","ic-sm")} ${existing?"Save changes":"Add to module"}</button>
    </div></div>`;
  document.body.appendChild(back);
  MATH_FIELDS.forEach(updateMathPreview);
  mountRichFields(back);
}
function closeTestQuestionEditor(){ document.getElementById("tqBack")?.remove(); TQ=null; }
async function saveTestQuestion(){
  if(!TQ||!TE.test) return;
  if(!await flushPendingMedia()){ toast("Fix the image upload before saving"); return; }
  formError("");
  const payload=readQuestionForm(); if(!payload) return;
  const base=`admin/tests/${TE.test.id}/modules/${TQ.moduleId}/questions`;
  const btn=document.getElementById("tqSave"); if(btn) btn.disabled=true;
  try{
    if(TQ.questionId){
      await api(`${base}/${TQ.questionId}`,{method:"PUT",body:JSON.stringify(payload)});
      toast("Test question saved");
    } else {
      const copyToBank=!!document.getElementById("tqCopyBank")?.checked;
      await api(base,{method:"POST",body:JSON.stringify({question:payload,copyToBank})});
      toast(copyToBank?"Question added to the module and copied to the bank":"Test-only question added");
      if(copyToBank){ statsCache=null; TE.bank=await api("questions").catch(()=>TE.bank); }
    }
    closeTestQuestionEditor();
    await reloadTestEdit();
  }catch(e){ formError("Save failed: "+e.message); if(btn) btn.disabled=false; }
}

// Draw a random sample from one module. This is the non-destructive shuffle: the
// stored module order never changes, so one mentor cannot reorder a shared test
// for everybody else.
function TR_sampleModule(moduleId){
  const m=TR.test.modules.find(x=>x.id===moduleId); if(!m) return;
  const n=Number(document.getElementById("trSample"+moduleId).value)||0;
  if(n<1){ toast("Enter how many questions to draw"); return; }
  m.questions.forEach(q=>TR.sel.delete(q.id));
  shuffledIds(m.questions.map(q=>q.id)).slice(0,n).forEach(id=>TR.sel.add(id));
  TR.shuffle=true;

  toast(`Drew ${Math.min(n,m.questions.length)} random question${Math.min(n,m.questions.length)===1?"":"s"} from ${m.title}`);

// ──────────────── STUDENT · sitting the test ────────────────
// The deadline lives on the server. The client only measures the gap between the
// two clocks once, then counts down to the server's expiry — so reloading the
// page, or nudging the system clock, buys no extra time.
let T=null;
function stopTestTimer(){ if(T&&T.timer){ clearInterval(T.timer); T.timer=null; } plExamStop(); }
function stopTestAutosave(){ if(T&&T.autosave){ clearInterval(T.autosave); T.autosave=null; } }
// While paused the server holds the time left; otherwise count down to its deadline.
function testRemaining(){
  if(!T) return null;
  if(T.status==="paused") return T.remaining??null;
  if(!T.attempt.expiresAt) return null;
  return Math.max(0,Math.round((new Date(T.attempt.expiresAt).getTime()-(Date.now()+T.skew))/1000));
}
function startTestTimer(){
  stopTestTimer();
  if(ftUntimed()) return; // untimed practice: no countdown and no automatic expiry
  plExamStart(); // Exam Mode: full screen + integrity monitoring while the clock runs
  T.timer=setInterval(()=>{
    const left=testRemaining();
    if(left===null) return;
    const el=document.getElementById("testTimer");
    if(el){ el.textContent=fmtTime(left); el.classList.toggle("low",left<=300); }
    writeLocalTestSnapshot();
    if(left<=0){ stopTestTimer(); toast("Time is up on this module"); advanceTestModule(true); }
  },1000);
}

// ── Session snapshot ──
// Everything needed to put a student back on the exact question they left:
// mirrored to localStorage on every change (it survives a closed tab and works
// offline) and pushed to /api/test-session on navigation, every 30 seconds,
// on pause, and when the page is hidden.
const TEST_AUTOSAVE_MS=30000;
const localTestKey=id=>`fnf_test_session_${state.user?.key||"anon"}_${id}`;
function testSnapshot(){
  return {
    testSessionId:T.id, moduleIndex:T.modIdx, currentQuestionIndex:T.qIdx,
    userAnswers:{...T.answers}, flaggedQuestions:[...T.flagged],
    remainingTimeSeconds:testRemaining(), status:T.status,
  };
}
function readLocalTestSnapshot(id){ try{ return JSON.parse(localStorage.getItem(localTestKey(id))||"null"); }catch{ return null; } }
function writeLocalTestSnapshot(extra={}){
  if(!T||T.status==="submitted") return;
  const prev=readLocalTestSnapshot(T.id)||{};
  try{ localStorage.setItem(localTestKey(T.id),JSON.stringify({...prev,...testSnapshot(),...extra,savedAt:new Date().toISOString()})); }catch{}
}
function clearLocalTestSnapshot(id){ try{ localStorage.removeItem(localTestKey(id)); }catch{} }
function setTestSaveState(kind){
  if(T) T.saveState=kind;
  const el=document.getElementById("testSave"); if(!el) return;
  el.classList.toggle("off",kind==="offline");
  el.textContent=kind==="offline"?"Offline · saved on this device":kind==="saving"?"Saving…":"Progress saved";
}
// Server replies carry the attempt row and the server clock; fold them in.
// Returns false when the server has moved the sitting on (module timed out,
// test submitted) so the caller reloads instead of carrying on stale.
function applyTestSession(r){
  if(!T||!r?.session) return true;
  T.attempt=r.attempt; T.skew=r.serverNow-Date.now();
  if(r.session.status==="submitted"||r.session.moduleIndex!==T.modIdx) return false;
  T.status=r.session.status; T.remaining=r.session.remainingTimeSeconds; T.session=r.session;
  return true;
}
function reloadTestSit(){ if(!T) return; state.attemptId=T.id; viewTestSit(); }

async function autosaveTest(){
  if(!T||T.status!=="active"||T.busy) return;
  const id=T.id;
  writeLocalTestSnapshot({synced:false});
  setTestSaveState("saving");
  try{
    const r=await api("test-session/save",{method:"POST",body:JSON.stringify(testSnapshot())});
    if(!T||T.id!==id||T.busy||state.view!=="testsit") return;
    if(!applyTestSession(r)) return reloadTestSit();
    writeLocalTestSnapshot({synced:true});
    setTestSaveState("saved");
  }catch(e){
    if(!T||T.id!==id) return;
    if(e.status===409&&state.view==="testsit"&&!T.busy) return reloadTestSit();
    setTestSaveState("offline");
  }
}
function startTestAutosave(){ stopTestAutosave(); T.autosave=setInterval(autosaveTest,TEST_AUTOSAVE_MS); }
// Last-chance save as the tab closes or goes to the background. keepalive lets
// the request outlive the page.
function flushTestOnHide(){
  if(!T||T.status!=="active"||state.view!=="testsit") return;
  writeLocalTestSnapshot({synced:false});
  const token=localStorage.getItem(LS.token);
  try{
    fetch("/api/test-session/save",{method:"POST",keepalive:true,body:JSON.stringify(testSnapshot()),
      headers:{"content-type":"application/json",...(token?{authorization:"Bearer "+token}:{})}}).catch(()=>{});
  }catch{}
}
window.addEventListener("pagehide",flushTestOnHide);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushTestOnHide(); });
// Back online: push whatever only made it to this device.
window.addEventListener("online",()=>{
  if(!T||state.view!=="testsit") return;
  if(T.status==="paused"&&readLocalTestSnapshot(T.id)?.pendingPause)
    syncPendingPause().then(r=>{ if(r==="refused") reloadTestSit(); });
  else if(T.status==="active") autosaveTest();
});
// A pause taken offline is replayed to the server on the next chance we get.
// Resolves "synced" (nothing pending, or the server now holds the pause),
// "refused" (time ran out or the test closed first) or "offline".
async function syncPendingPause(id=T?.id){
  const local=readLocalTestSnapshot(id);
  if(!local?.pendingPause) return "synced";
  try{
    const r=await api("test-session/pause",{method:"POST",body:JSON.stringify({...local,status:"paused"})});
    const next={...local,pendingPause:false,synced:true,remainingTimeSeconds:r.session.remainingTimeSeconds};
    try{ localStorage.setItem(localTestKey(id),JSON.stringify(next)); }catch{}
    if(T&&T.id===id){ applyTestSession(r); setPauseNote("saved"); }
    return "synced";
  }catch(e){
    if(!e.status) return "offline";
    // Refused outright: the local pause is moot, the server's state stands.
    try{ localStorage.setItem(localTestKey(id),JSON.stringify({...local,pendingPause:false})); }catch{}
    if(T&&T.id===id&&e.message) toast(e.message);
    return "refused";
  }
}
// Called by go() whenever the student navigates away from the test.
function leaveTestSit(){
  if(T&&T.status==="active"&&state.view==="testsit") autosaveTest();
  stopTestTimer(); stopTestAutosave(); removePauseOverlay(); stopFtBreak(); ftExitRunner(); ftCloseModal(); plExamEnd();
  if(desmosFloatEl&&DF.ctx?.startsWith("test:")) desmosDestroy();
}

async function viewTestSit(){
  if(!state.attemptId) return go("tests");
  stopTestTimer(); stopTestAutosave(); removePauseOverlay(); stopFtBreak();
  // A different sitting gets its own calculator; the same sitting keeps its work.
  if(desmosFloatEl&&DF.ctx!==`test:${state.attemptId}`) desmosDestroy();
  crumbs([{label:"Full-Length Tests",onclick:"go('tests')"},{label:"Test"}]);
  loading();
  await syncPendingPause(state.attemptId);
  let data;
  try{ data=await api("test-session/"+state.attemptId); }
  catch(e){ toast(e.message); return go("tests"); }
  const s=data.session;
  T={
    id:data.attempt.id,
    attempt:data.attempt,
    test:data.test,
    skew:data.serverNow-Date.now(),
    modIdx:Math.min(data.attempt.moduleIndex,Math.max(0,data.test.modules.length-1)),
    qIdx:Math.max(0,s.currentQuestionIndex|0),
    answers:{...(s.userAnswers||{})},
    flagged:new Set((s.flaggedQuestions||[]).map(Number)),
    status:s.status,
    remaining:s.remainingTimeSeconds,
    session:s, report:data.report||null, breakEndsAt:s.breakEndsAt||null,
    timer:null, autosave:null, busy:false, saveState:"saved",
  };
  crumbs([{label:"Full-Length Tests",onclick:"go('tests')"},{label:T.test.title}]);
  // Personal highlights for this sitting only — a new attempt starts clean.
  if(s.status!=="submitted"&&state.user.role==="student") await ftHlLoad(T.id); else FT_HL.byQ=new Map();
  if(s.status==="submitted"){ clearLocalTestSnapshot(T.id); clearActiveQuiz(); renderTestResult(); return; }
  // Only the student sits the test; staff opening a live sitting just see where it stands.
  if(state.user.role!=="student"){ $c().innerHTML=`<div class="empty"><p>This sitting is still in progress (module ${T.modIdx+1} of ${T.test.modules.length}). The score report appears once the student submits.</p></div>`; return; }
  writeActiveQuiz({kind:"test",attemptId:T.id});
  // Work done on this device after the server's last save — offline answers, a
  // reload that beat the autosave — wins for the module the student is on.
  const local=readLocalTestSnapshot(T.id);
  let behind=false;
  if(local&&local.moduleIndex===T.modIdx&&new Date(local.savedAt||0)>new Date(data.attempt.lastSavedAt||0)){
    const mod=currentTestModule();
    T.qIdx=Math.max(0,local.currentQuestionIndex|0);
    for(const q of mod?.questions||[]){
      const v=local.userAnswers?.[String(q.id)];
      if(v) T.answers[String(q.id)]=v; else delete T.answers[String(q.id)];
    }
    T.flagged=new Set((local.flaggedQuestions||[]).map(Number));
    behind=true;
  }
  if(T.status==="paused"){
    writeLocalTestSnapshot();
    $c().innerHTML="";
    showPauseOverlay(); setPauseNote("saved");
    if(state.resumeOnOpen){ state.resumeOnOpen=false; return resumeTest(); }
    return;
  }
  state.resumeOnOpen=false;
  // Between sections: show the break screen; the module clock starts after it.
  if(T.breakEndsAt&&new Date(T.breakEndsAt).getTime()>Date.now()+T.skew){ writeLocalTestSnapshot(); return startTestBreak(T.breakEndsAt); }
  startTestTimer(); startTestAutosave();
  renderTestQuestion();
  writeLocalTestSnapshot();
  if(behind) autosaveTest();
}

// ── Pause & resume ──
// Pausing freezes the countdown on the spot, hides every question behind a
// full-screen cover, and asks the server to hold the time left. Offline, the
// snapshot waits in localStorage and is replayed as soon as we reconnect.
async function pauseTest(){
  if(!T||T.status!=="active"||T.busy) return;
  const left=testRemaining();
  stopTestTimer(); stopTestAutosave();
  T.status="paused"; T.remaining=left;
  $c().innerHTML="";
  showPauseOverlay(); setPauseNote("saving");
  writeLocalTestSnapshot({pendingPause:true,synced:false});
  const result=await syncPendingPause(T.id);
  if(result==="offline") setPauseNote("offline");
  else if(result==="refused") reloadTestSit();
}
async function resumeTest(){
  if(!T||T.busy) return;
  T.busy=true; setPauseNote("resuming");
  const id=T.id;
  const pending=await syncPendingPause(id);
  if(pending==="refused"){ T.busy=false; return reloadTestSit(); }
  try{
    if(pending==="offline") throw new Error("offline");
    const r=await api("test-session/resume",{method:"POST",body:JSON.stringify({testSessionId:id})});
    T.busy=false;
    if(!applyTestSession(r)) return reloadTestSit();
  }catch(e){
    T.busy=false;
    if(e.status){ toast(e.message); return reloadTestSit(); }
    // Still offline. If the pause never reached the server its clock never
    // stopped, so carry on against that clock; if it did, the time is held
    // there and we need the connection back to restart it.
    if(ftUntimed()) T.status="active";
    else {
      if(!T.attempt.expiresAt){ setPauseNote("offline-resume"); return; }
      T.status="active";
      toast("You're offline — the pause didn't reach the server, so the clock kept running.");
    }
  }
  writeLocalTestSnapshot({pendingPause:false});
  removePauseOverlay();
  startTestTimer(); startTestAutosave();
  renderTestQuestion();
}
function exitPausedTest(){ go("tests"); }
function showPauseOverlay(){
  removePauseOverlay();
  const mod=currentTestModule();
  const el=document.createElement("div");
  el.className="pause-overlay"; el.id="pauseOverlay";
  el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-labelledby","pauseTitle");
  el.innerHTML=`<div class="pause-card">
    <div class="badge-ic tone-gold" style="margin:0 auto;width:54px;height:54px">${svg("pause")}</div>
    <h2 id="pauseTitle">Test paused</h2>
    <p class="umeta" style="margin-top:.3rem">${esc(T.test.title)} · Module ${T.modIdx+1} of ${T.test.modules.length}${mod?.questions?.length?` · Question ${Math.min(T.qIdx,mod.questions.length-1)+1}`:""}</p>
    ${ftUntimed()?`<div class="pause-time">Untimed</div><div class="test-save">no clock is running on this practice</div>`
      :`<div class="pause-time">${T.remaining==null?"—":fmtTime(T.remaining)}</div>
    <div class="test-save">left on the clock · frozen until you resume</div>`}
    <p class="pause-note" id="pauseNote"></p>
    <div class="pause-actions">
      <button type="button" class="btn btn-primary" id="resumeBtn" onclick="resumeTest()">${svg("play","ic-sm")} Resume test</button>
      <button type="button" class="btn btn-ghost" onclick="exitPausedTest()">${svg("back","ic-sm")} Save &amp; exit</button>
    </div></div>`;
  document.body.appendChild(el);
  document.body.classList.add("test-paused");
  desmosHide();
  setTimeout(()=>document.getElementById("resumeBtn")?.focus(),30);
}
function removePauseOverlay(){
  document.getElementById("pauseOverlay")?.remove();
  document.body.classList.remove("test-paused");
}
function setPauseNote(kind){
  const el=document.getElementById("pauseNote"); if(!el) return;
  const notes={
    saving:"Saving your place…",
    saved:"Your answers, flags and place are saved to your account. Resume from here or from your dashboard any time.",
    offline:"You're offline. Your place is saved on this device and syncs as soon as you reconnect.",
    resuming:"Resuming…",
    "offline-resume":"Reconnect to resume — the time left is being held on the server.",
  };
  el.textContent=notes[kind]||"";
  el.classList.toggle("off",kind==="offline"||kind==="offline-resume");
  const btn=document.getElementById("resumeBtn"); if(btn) btn.disabled=kind==="resuming"||kind==="saving";
}

function setTestAnswerLocal(questionId,value){
  const v=String(value||"").trim();
  if(v) T.answers[String(questionId)]=v; else delete T.answers[String(questionId)];
  writeLocalTestSnapshot({synced:false});
}
async function saveTestAnswer(questionId,value){
  setTestAnswerLocal(questionId,value);
  setTestSaveState("saving");
  try{ await api(`test-attempts/${T.id}/answer`,{method:"POST",body:JSON.stringify({questionId,selected:String(value||"").trim()})}); setTestSaveState("saved"); }
  catch(e){
    // Offline: the answer is already on this device; retry shortly, and the
    // regular autosave carries it to the server as soon as we reconnect.
    if(e.status) toast(e.message);
    else { setTestSaveState("offline"); clearTimeout(T.retry); T.retry=setTimeout(()=>{ if(T&&T.status==="active") autosaveTest(); },5000); }
    return;
  }
}
// Moving on is a server call so the next module's clock starts on the server's
// terms; the reply tells us whether the whole test just closed out.
async function advanceTestModule(auto){
  const lastMod=T.modIdx+1>=T.test.modules.length;
  if(!auto&&!confirm(lastMod?"Submit the test? You will not be able to change your answers.":"Submit this module and move on? You cannot come back to it.")) return;
  T.busy=true; stopTestTimer(); stopTestAutosave(); loading();
  // Land every answer on the server before the module closes behind it.
  try{ await api("test-session/save",{method:"POST",body:JSON.stringify(testSnapshot())}); }catch{}
  try{ await api(`test-attempts/${T.id}/advance`,{method:"POST",body:JSON.stringify({moduleIndex:T.modIdx})}); }
  catch(e){ toast(e.message); }
  state.attemptId=T.id;
  viewTestSit();
}
async function submitTest(auto){
  if(!auto&&!confirm("Submit the test now? Unanswered questions are marked incorrect.")) return;
  T.busy=true; stopTestTimer(); stopTestAutosave(); loading();
  try{ await api("test-session/save",{method:"POST",body:JSON.stringify(testSnapshot())}); }catch{}
  try{ await api(`test-attempts/${T.id}/submit`,{method:"POST"}); }
  catch(e){ toast(e.message); }
  state.attemptId=T.id;
  viewTestSit();
}

let calcDeg=true, calcAns=0, calcTab="sci";

function switchCalc(t){ calcTab=t; document.querySelectorAll(".calc-tabs button").forEach(b=>b.classList.remove("on")); event.target.closest("button").classList.add("on"); renderCalcBody(); }

function sciCalcHTML(){
  const keys=[
    ["mode",calcDeg?"DEG":"RAD","calcToggleDeg()"],["fn","sin","calcIns('sin(')"],["fn","cos","calcIns('cos(')"],["fn","tan","calcIns('tan(')"],["op","÷","calcIns('/')"],
    ["fn","asin","calcIns('asin(')"],["fn","acos","calcIns('acos(')"],["fn","atan","calcIns('atan(')"],["op","( )","calcParen()"],["op","×","calcIns('*')"],
    ["fn","ln","calcIns('ln(')"],["","7","calcIns('7')"],["","8","calcIns('8')"],["","9","calcIns('9')"],["op","−","calcIns('-')"],
    ["fn","log","calcIns('log(')"],["","4","calcIns('4')"],["","5","calcIns('5')"],["","6","calcIns('6')"],["op","+","calcIns('+')"],
    ["fn","√","calcIns('sqrt(')"],["","1","calcIns('1')"],["","2","calcIns('2')"],["","3","calcIns('3')"],["op","^","calcIns('^')"],
    ["fn","π","calcIns('pi')"],["","0","calcIns('0')"],["",".","calcIns('.')"],["fn","!","calcIns('!')"],["eq","=","calcEquals()"],
    ["fn","e","calcIns('e')"],["fn","exp","calcIns('exp(')"],["fn","abs","calcIns('abs(')"],["fn","Ans","calcIns(String(calcAns))"],["op","%","calcIns('%')"],
    ["op","C","calcClear()"],["op","⌫","calcBack()"],
  ];
  return `<div class="sci">
    <input class="sci-display" id="calcDisplay" placeholder="0" onkeydown="if(event.key==='Enter'){event.preventDefault();calcEquals();}"/>
    <div class="sci-sub" id="calcSub"></div>
    <div class="sci-grid">
      ${keys.map(([cls,label,fn])=>`<button class="${cls}" onclick="${fn}">${esc(label)}</button>`).join("")}
    </div>
  </div>`;
}
function calcToggleDeg(){ calcDeg=!calcDeg; const b=event.target; b.textContent=calcDeg?"DEG":"RAD"; }
function calcIns(s){ const d=document.getElementById("calcDisplay"); d.value+=s; d.focus(); }
function calcClear(){ const d=document.getElementById("calcDisplay"); d.value=""; document.getElementById("calcSub").textContent=""; d.focus(); }
function calcBack(){ const d=document.getElementById("calcDisplay"); d.value=d.value.slice(0,-1); d.focus(); }
function calcParen(){
  const d=document.getElementById("calcDisplay"); const v=d.value;

// Scientific expression evaluator: tokenize → shunting-yard (RPN) → evaluate.
function sciEval(input, deg){
  const s=input.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s+/g,"");
  const FUNCS=["sin","cos","tan","asin","acos","atan","sqrt","ln","log","exp","abs"];
  const toks=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/[0-9.]/.test(c)){
      let num=c; i++;
      while(i<s.length){ const d=s[i];
        if(/[0-9.]/.test(d)){ num+=d; i++; }
        else if((d==="e"||d==="E") && /[0-9]/.test(s[i+1]||"")){ num+=d; i++; }
        else if((d==="e"||d==="E") && (s[i+1]==="+"||s[i+1]==="-")){ num+=d+s[i+1]; i+=2; }
        else break;
      }
      toks.push({t:"num",v:parseFloat(num)}); continue;
    }
    if(/[a-zA-Z]/.test(c)){
      let name=""; while(i<s.length && /[a-zA-Z]/.test(s[i])){ name+=s[i]; i++; }
      const low=name.toLowerCase();
      if(low==="pi") toks.push({t:"num",v:Math.PI});
      else if(low==="e") toks.push({t:"num",v:Math.E});
      else if(FUNCS.includes(low)) toks.push({t:"func",v:low});
      else throw new Error("Unknown "+name);
      continue;
    }
    if("+-*/^%()!".includes(c)){ toks.push({t:"op",v:c}); i++; continue; }
    throw new Error("Bad char "+c);
  }
  const prec={"u-":5,"^":4,"*":3,"/":3,"%":3,"+":2,"-":2};
  const rightAssoc={"^":true,"u-":true};
  const out=[], ops=[]; let prev=null;
  for(const tok of toks){
    if(tok.t==="num"){ out.push(tok); }
    else if(tok.t==="func"){ ops.push(tok); }
    else {
      const v=tok.v;
      if(v==="("){ ops.push(tok); }
      else if(v===")"){
        while(ops.length && ops[ops.length-1].v!=="(") out.push(ops.pop());
        if(!ops.length) throw new Error("Mismatched )");
        ops.pop();
        if(ops.length && ops[ops.length-1].t==="func") out.push(ops.pop());
      }
      else if(v==="!"){ out.push({t:"op",v:"!"}); }
      else {
        let op=v;
        const unary=(v==="-"||v==="+") && (prev===null || (prev.t==="op" && prev.v!=="!" && prev.v!==")"));
        if(unary) op = v==="-"?"u-":"u+";
        if(op!=="u+"){
          while(ops.length){
            const top=ops[ops.length-1];
            if(top.t==="func"){ out.push(ops.pop()); continue; }
            if(top.v==="(") break;
            const tp=prec[top.v]; if(tp===undefined) break;
            if(tp>prec[op] || (tp===prec[op] && !rightAssoc[op])) out.push(ops.pop());
            else break;
          }
          ops.push({t:"op",v:op});
        }
      }
    }
    prev=tok;
  }
  while(ops.length){ const t=ops.pop(); if(t.v==="(") throw new Error("Mismatched ("); out.push(t); }
  const toRad=x=>deg?x*Math.PI/180:x, fromRad=x=>deg?x*180/Math.PI:x;
  const fact=n=>{ if(n<0||n!==Math.floor(n)) return NaN; let r=1; for(let k=2;k<=n;k++) r*=k; return r; };
  const st=[];
  for(const tok of out){
    if(tok.t==="num"){ st.push(tok.v); continue; }
    if(tok.t==="func"){
      const a=st.pop();
      const f={ sin:()=>Math.sin(toRad(a)), cos:()=>Math.cos(toRad(a)), tan:()=>Math.tan(toRad(a)),
        asin:()=>fromRad(Math.asin(a)), acos:()=>fromRad(Math.acos(a)), atan:()=>fromRad(Math.atan(a)),
        sqrt:()=>Math.sqrt(a), ln:()=>Math.log(a), log:()=>Math.log10(a), exp:()=>Math.exp(a), abs:()=>Math.abs(a) }[tok.v];
      st.push(f()); continue;
    }
    const v=tok.v;
    if(v==="u-"){ st.push(-st.pop()); continue; }
    if(v==="!"){ st.push(fact(st.pop())); continue; }
    const b=st.pop(), a=st.pop();
    st.push(v==="+"?a+b : v==="-"?a-b : v==="*"?a*b : v==="/"?a/b : v==="^"?Math.pow(a,b) : a%b);
  }
  if(st.length!==1 || isNaN(st[0])) throw new Error("Invalid expression");
  return st[0];
}

function compositionRows(stats){
  const max=Math.max(1,...stats.map(s=>Number(s.count)));
  const all=[];
  Object.entries(SECTIONS).forEach(([sec,cfg])=>cfg.categories.forEach(cat=>{
    const c=Number(stats.find(s=>s.section===sec&&s.category===cat)?.count||0);
    all.push({sec,cat,c,tone:cfg.tone});
  }));
  if(!all.some(a=>a.c)) return `<div class="empty" style="padding:1.5rem"><p>The bank is empty. Seed a sample set or add your first question.</p><button class="btn btn-primary btn-sm" onclick="seedBank()">${svg("plus","ic-sm")} Seed sample bank</button></div>`;
  return all.map(a=>{
    const col=a.sec==="math"?"var(--accent)":"var(--mint)";
    return `<div class="bar-row"><div class="bn">${esc(a.cat)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(a.c/max*100)}%;background:${col}"></div></div>
      <div class="bar-pct">${a.c}</div></div>`;
  }).join("");
}

const MATH_FIELDS=["qPassage","qPrompt","qcA","qcB","qcC","qcD","qSpr","qExplain"];
function onSectionChange(){

function onTypeChange(){

  document.getElementById("choiceBlock").style.display=spr?"none":"block";
  document.getElementById("sprBlock").style.display=spr?"block":"none";

function markCorrect(){
  const v=document.querySelector('input[name="qcorrect"]:checked')?.value;
  ["A","B","C","D"].forEach(l=>document.getElementById("cl"+l).classList.toggle("correct",l===v));
}
async function saveQuestion(){
  if(!await flushPendingMedia()){ toast("Fix the image upload before saving"); return; }
  formError("");
  const payload=readQuestionForm(); if(!payload) return;
  try{
    if(M.editing){ await api("questions/"+M.editing,{method:"PUT",body:JSON.stringify(payload)}); toast("Question saved"); }
    else { const row=await api("questions",{method:"POST",body:JSON.stringify(payload)}); M.editing=row.id; toast("Question created"); }
    statsCache=null; await loadManage();
    syncQuestionBrowsers();
    const q=M.list.find(x=>x.id===M.editing); if(q) renderForm(JSON.parse(JSON.stringify(q)),false);
  }catch(e){ formError("Save failed: "+e.message); }
}
// Read and check the editor fields. Returns the payload, or null after showing
// the problem in the form's error box.
function readQuestionForm(){
  const type=document.getElementById("qType").value;
  const payload={
    section:document.getElementById("qSection").value,
    category:document.getElementById("qCategory").value,
    subcategory:document.getElementById("qSubcategory").value,
    difficulty:Number(document.getElementById("qDiff").value),
    type, passage:(document.getElementById("qPassage").value||"").trim()||null,
    prompt:(document.getElementById("qPrompt").value||"").trim(),
    questionImage:(document.getElementById("qImage").value||"").trim()||null,
    explanation:(document.getElementById("qExplain").value||"").trim(),
  };
  if(!payload.prompt&&!payload.questionImage){ formError("Add a question prompt or a question image."); return null; }
  if(!payload.prompt) payload.prompt="Refer to the question image.";
  if(!payload.subcategory){ formError("Choose a subsection."); return null; }
  if(type==="spr"){
    payload.answer=(document.getElementById("qSpr").value||"").trim();
    payload.choices=null;
    if(!payload.answer){ formError("Add the correct answer."); return null; }
  } else {
    const ch={},imgs={}; for(const l of ["A","B","C","D"]){ ch[l]=(document.getElementById("qc"+l).value||"").trim(); imgs[l]=(document.getElementById("qcImage"+l).value||"").trim(); }
    const blank=["A","B","C","D"].filter(l=>!ch[l]&&!imgs[l]);
    // With a question graphic attached the options may live inside it, so blank
    // choice fields are legitimate — the student still gets the A–D buttons.
    if(blank.length&&!payload.questionImage){
      formError(`Add text or an image for choice${blank.length>1?"s":""} ${blank.join(", ")} — or attach a question image if the options are part of the graphic.`);
      return null;
    }
    const corr=document.querySelector('input[name="qcorrect"]:checked')?.value;
    if(!corr){ formError("Mark which choice is correct."); return null; }
    payload.choices=ch; payload.choiceImages=imgs; payload.answer=corr;
  }
  return payload;
}
// Validation feedback that stays on screen. A toast fades after a few seconds,
// which is how a blocked save could look like a save that worked.
function formError(message){
  const el=document.getElementById("qFormError"); if(!el) return;
  el.textContent=message||"";
  el.style.display=message?"block":"none";
  if(message) el.scrollIntoView({block:"nearest",behavior:"smooth"});
}
// ── question graphics in the studio ─────────────────────────
// Picking a file uploads it immediately. The old flow needed a second click on
// "Upload image" before the URL was attached, so an admin who chose a graph and
// went straight to Save stored a question with no graphic at all — which is why
// graphs never reached the student panel.
function mediaIds(kind,label){
  return kind==="question"
    ? {file:"qImageFile",hidden:"qImage",status:"qImageStatus",tools:"qImageTools",preview:"qImagePreview",alt:"Question graphic",variant:"question"}
    : {file:"qcFile"+label,hidden:"qcImage"+label,status:"qcStatus"+label,tools:"qcTools"+label,preview:"qcPreview"+label,alt:`Choice ${label} graphic`,variant:"choice"};
}
function setMediaStatus(id,message,tone){
  const el=document.getElementById(id); if(!el) return;
  el.textContent=message||""; el.className="media-status"+(tone?" "+tone:"");
}
function applyQuestionMedia(kind,label,url){
  const ids=mediaIds(kind,label);
  const hidden=document.getElementById(ids.hidden); if(hidden) hidden.value=url||"";
  const preview=document.getElementById(ids.preview);
  if(preview) preview.innerHTML=questionMediaHTML(url,ids.alt,ids.variant);
  const tools=document.getElementById(ids.tools);
  if(tools) tools.style.display=url?"flex":"none";
}
function clearQuestionMedia(kind,label){
  const ids=mediaIds(kind,label);
  applyQuestionMedia(kind,label,"");
  const input=document.getElementById(ids.file); if(input) input.value="";
  setMediaStatus(ids.status,"Graphic removed. Save the question to confirm.");
}
async function uploadQuestionMedia(kind,label){
  const ids=mediaIds(kind,label);
  const input=document.getElementById(ids.file);
  const file=input?.files?.[0];
  if(!file){ setMediaStatus(ids.status,"Choose an image file first.","err"); return false; }
  if(!(file.type||"").startsWith("image/")){ setMediaStatus(ids.status,"That file is not an image — use PNG, JPG, SVG or WebP.","err"); return false; }
  if(file.size>3_000_000){ setMediaStatus(ids.status,"That image is over 3 MB. Export the graph a little smaller.","err"); return false; }
  setMediaStatus(ids.status,`Uploading ${file.name}…`);
  try{
    const token=localStorage.getItem(LS.token);
    const response=await fetch("/api/question-media",{method:"POST",headers:{"content-type":file.type,authorization:"Bearer "+token},body:file});
    if(!response.ok){ let message="Upload failed"; try{message=(await response.json()).error||message}catch{} throw new Error(message); }
    const result=await response.json();
    applyQuestionMedia(kind,label,result.url);
    if(input) input.value="";
    setMediaStatus(ids.status,"Graphic attached — remember to save the question.","ok");
    return true;
  }catch(e){
    setMediaStatus(ids.status,e.message,"err");
    toast("Image upload failed: "+e.message);
    return false;
  }
}
// Safety net for a save that follows a failed or interrupted upload: anything
// still sitting in a file input is uploaded before the question is written.
async function flushPendingMedia(){
  const slots=[["question",null],...["A","B","C","D"].map(l=>["choice",l])];
  for(const [kind,label] of slots){
    const ids=mediaIds(kind,label);
    const input=document.getElementById(ids.file);
    const hidden=document.getElementById(ids.hidden);
    if(!input?.files?.length||!hidden||hidden.value) continue;
    if(!await uploadQuestionMedia(kind,label)) return false;
  }
  return true;
}
async function deleteQuestion(id){
  if(!confirm("Delete this question permanently?")) return;
  try{ await api("questions/"+id,{method:"DELETE"}); statsCache=null; M.editing=null; await loadManage(); syncQuestionBrowsers(); renderForm(null); toast("Question deleted"); }
  catch(e){ toast("Delete failed: "+e.message); }
}

// Built-in slugs are wired into the app (About page, dashboard greeting) so
// they always appear and can't be deleted — but admins can add any number of
// extra pages and edit them all from here, no code required.
const BUILTIN_PAGES={
  about:{label:"About Us",hint:"Shown to students on the public About page.",locked:true},
  dashboard:{label:"Dashboard welcome",hint:"Greeting + subtitle on the studio dashboard.",locked:true},
};
let PG={list:[],current:null};
function pageLabel(slug){ return BUILTIN_PAGES[slug]?.label || slug; }
async function viewPages(){
  crumbs([{label:"Pages"}]);
  $c().innerHTML=`<div class="page-head fade"><h1>Pages</h1><p>Create, edit, and remove the content shown across the studio — no code required.</p></div>
    <div class="manage fade">
      <div class="q-list">
        <div class="q-list-head">
          <button class="btn btn-primary btn-sm btn-block" onclick="newPage()">${svg("plus","ic-sm")} New page</button>
        </div>

      </div>
      <div id="pgForm"></div>
    </div>`;
  await loadPages();
}
async function loadPages(){
  let rows=[]; try{ rows=await api("pages"); }catch{}
  const map={};
  // Built-ins always show, even before they've been saved once.
  Object.keys(BUILTIN_PAGES).forEach(slug=>{ map[slug]={slug,title:BUILTIN_PAGES[slug].label,body:""}; });
  rows.forEach(r=>{ map[r.slug]={...map[r.slug],...r}; });
  PG.list=Object.values(map);
  if(!PG.current||!PG.list.some(p=>p.slug===PG.current)) PG.current=PG.list[0]?.slug||null;
  renderPgList(); renderPgForm();
}
function renderPgList(){
  const el=document.getElementById("pgList"); if(!el) return;
  if(!PG.list.length){ el.innerHTML=`<div class="empty" style="padding:1.4rem"><p>No pages yet.</p></div>`; return; }
  el.innerHTML=PG.list.map(p=>`<button class="q-li ${PG.current===p.slug?"active":""}" onclick="selectPage('${p.slug}')">
    <span class="qn">${svg("pages","ic-sm")}</span>
    <span class="qt">${esc(pageLabel(p.slug))} <span style="color:var(--ink3)">/${esc(p.slug)}</span></span>
    ${BUILTIN_PAGES[p.slug]?`<span class="pill pill-med" style="flex-shrink:0">core</span>`:""}</button>`).join("");
}
function selectPage(slug){ PG.current=slug; renderPgList(); renderPgForm(); }
function newPage(){
  const raw=prompt('New page slug (lowercase letters, numbers and dashes — e.g. "faq" or "privacy"):');
  if(raw===null) return;
  const slug=raw.trim().toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"");
  if(!slug){ toast("Enter a valid slug"); return; }
  if(PG.list.some(p=>p.slug===slug)){ selectPage(slug); toast("That page already exists"); return; }
  PG.list.push({slug,title:"",body:""}); selectPage(slug);
}
function renderPgForm(){
  const el=document.getElementById("pgForm"); if(!el) return;
  const p=PG.list.find(x=>x.slug===PG.current);
  if(!p){ el.innerHTML=`<div class="panel"><div class="empty" style="padding:2.5rem"><div class="ei">${svg("pages")}</div><p>Select a page to edit, or create a new one.</p></div></div>`; return; }
  const meta=BUILTIN_PAGES[p.slug];
  el.innerHTML=`<div class="panel">
    <h2>${svg("pages","ic-sm")} ${esc(pageLabel(p.slug))}</h2>
    <p style="color:var(--ink3);font-size:.83rem;margin-top:-.6rem;margin-bottom:1rem">${esc(meta?.hint||("Custom page stored under the slug “"+p.slug+"”."))}</p>
    <div class="form-grid">
      <div class="field"><label>Slug</label><input value="/${esc(p.slug)}" disabled/></div>
      <div class="field"><label>Title</label><input id="pgTitle" value="${esc(p.title||"")}"/></div>
      ${richFieldHTML("pgBody",{label:"Body",value:p.body||"",placeholder:"Write the page — headings, lists, links and fonts all come from the toolbar.",math:false})}
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:1.1rem">
        <button class="btn btn-primary" onclick="savePage()">${svg("save","ic-sm")} Save page</button>
        ${meta?.locked?"":`<button class="btn btn-danger" onclick="deletePage('${p.slug}')">${svg("trash","ic-sm")} Delete</button>`}
      </div>
    </div></div>`;
  mountRichFields(el);
}
async function savePage(){
  const p=PG.list.find(x=>x.slug===PG.current); if(!p) return;
  const title=(document.getElementById("pgTitle").value||"").trim();
  const body=(document.getElementById("pgBody").value||"").trim();
  try{ await api("pages/"+p.slug,{method:"PUT",body:JSON.stringify({title:title||pageLabel(p.slug),body})}); toast("Page saved"); await loadPages(); }
  catch(e){ toast("Save failed: "+e.message); }
}
async function deletePage(slug){
  if(!confirm('Delete the “'+pageLabel(slug)+'” page permanently?')) return;
  try{ await api("pages/"+slug,{method:"DELETE"}); PG.current=null; toast("Page deleted"); await loadPages(); }
  catch(e){ toast("Delete failed: "+e.message); }
}

function US_expand(id,on){ if(on) US.open.add(id); else US.open.delete(id); }
function filteredMonitorStudents(){
  const f=US.filter;
  let list=(US.data.students||[]).slice();
  if(f.classId==="none") list=list.filter(s=>!(s.classes||[]).length);
  else if(f.classId) list=list.filter(s=>(s.classes||[]).some(c=>String(c.id)===f.classId));
  if(f.mentorId) list=list.filter(s=>(s.classes||[]).some(c=>String(c.mentorId)===f.mentorId));

    list=list.filter(s=>[s.displayName,s.email,s.username,s.phone].some(v=>String(v??"").toLowerCase().includes(term)));
