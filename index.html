// The mentor panel gets the same monitoring board, scoped to their classes.
async function viewStudents(){
  crumbs([{label:"Student Stats"}]); loading();
  await loadStudentMonitor();
  $c().innerHTML=`<div class="page-head fade"><h1>Student Stats</h1><p>Everyone enrolled in your classes, with their question-bank record by section and domain and every full-length test they have sat.</p></div>
    <div class="fade">${studentMonitorHTML()}</div>`;
  renderStudentMonitorList();
}

async function viewUsers(){
  crumbs([{label:"Users & Stats"}]);
  loading();
  let list=[],ov=null;
  try{ list=await api("users"); }catch{}
  try{ ov=await api("stats/overview"); }catch{}
  await loadStudentMonitor();
  ov=ov||{users:list.length,attempts:0,correct:0,accuracy:0,activeStudents:0,bySection:[]};
  const secBars=(ov.bySection||[]).map(s=>{
    const label=SECTIONS[s.section]?.label||s.section;
    const col=s.section==="math"?"var(--accent)":"var(--mint)";
    return `<div class="bar-row"><div class="bn">${esc(label)} <span style="color:var(--ink3)">· ${s.total} answered</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${s.accuracy}%;background:${col}"></div></div>
      <div class="bar-pct">${s.accuracy}%</div></div>`;
  }).join("");
  const rows=list.map(u=>{
    const login=u.email||u.username||u.phone||"—";
    let joined="—"; try{ if(u.createdAt) joined=new Date(u.createdAt).toLocaleDateString(); }catch{}
    const status=u.status||"active";
    const actions=u.role==="admin"?`<span class="umeta">Protected</span>`:`<div style="display:flex;gap:.35rem;flex-wrap:wrap">
      ${u.role==="mentor"&&status==="pending"?`<button class="btn btn-primary btn-sm" onclick="createMentorCode(${u.id},'${esc(u.displayName).replace(/'/g,"&#39;")}')">Approve</button>`:""}
      <button class="btn btn-ghost btn-sm" onclick="PL_resetPassword(${u.id},'${esc(u.displayName).replace(/'/g,"&#39;")}')">${svg("lock","ic-sm")} Reset password</button>
      ${u.role==="student"?`<button class="btn btn-ghost btn-sm" onclick="PL_userLimits(${u.id},'${esc(u.displayName).replace(/'/g,"&#39;")}')">Limits</button>`:""}
      <button class="btn ${status==="banned"?"btn-ghost":"btn-danger"} btn-sm" onclick="setUserBan(${u.id},${status!=="banned"})">${status==="banned"?"Unban":"Ban"}</button>
      <button class="btn btn-danger btn-sm" onclick="deleteUserAccount(${u.id},'${esc(u.displayName).replace(/'/g,"&#39;")}')">Delete</button></div>`;
    return `<tr>
      <td><div class="uname">${esc(u.displayName||"Student")}</div><div class="umeta">${esc(login)}</div></td>
      <td><span class="prov-tag">${esc(u.role||"student")}</span></td>
      <td><span class="prov-tag">${esc(status)}</span>${u.mustChangePassword?`<div class="umeta">must change password</div>`:""}</td>
      <td><span class="prov-tag">${esc(u.provider||"password")}</span></td>
      <td class="umeta">${esc(joined)}</td>
      <td>${u.attempts}</td>
      <td>${u.attempts?u.accuracy+"%":"—"}</td>
      <td>${actions}</td>
    </tr>`;
  }).join("");
  $c().innerHTML=`<div class="page-head fade"><h1>Users &amp; Stats</h1><p>Track every website account, approve mentors, and manage access.</p></div>
  <div class="fade">
    <div class="stat-grid">
      <div class="stat-card"><div class="lbl">${svg("users","ic-sm")} Registered</div><div class="val">${ov.users}</div></div>
      <div class="stat-card"><div class="lbl">${svg("flame","ic-sm")} Active students</div><div class="val" style="color:var(--gold)">${ov.activeStudents}</div></div>
      <div class="stat-card"><div class="lbl">${svg("target","ic-sm")} Total answers</div><div class="val">${ov.attempts}</div></div>
      <div class="stat-card"><div class="lbl">${svg("check","ic-sm")} Accuracy</div><div class="val" style="color:var(--mint)">${ov.accuracy}<span style="font-size:1.1rem;color:var(--ink3)">%</span></div></div>
    </div>
    ${secBars?`<div class="panel"><h2>${svg("layers","ic-sm")} Accuracy by section</h2>${secBars}</div>`:""}
    ${studentMonitorHTML()}
    <div class="panel">
      <div class="ch-admin-head"><h2>${svg("users","ic-sm")} All registered users</h2><button class="btn btn-ghost btn-sm" onclick="PL_showAudit()">${svg("pages","ic-sm")} Audit log</button></div>
      ${list.length?`<div class="utable-wrap"><table class="utable">
        <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Sign-in</th><th>Joined</th><th>Answered</th><th>Accuracy</th><th>Actions</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
      :`<div class="empty" style="padding:1.6rem"><p>No users have registered yet.</p></div>`}
    </div>
  </div>`;
  renderStudentMonitorList();
}
async function createMentorCode(mentorId,name){
  try{
    const r=await api("mentor-codes",{method:"POST",body:JSON.stringify({mentorId})});
    alert(`One-time activation code for ${name}:\n\n${r.code}\n\nThis code expires ${new Date(r.expiresAt).toLocaleString()}.`);
  }catch(e){ toast(e.message); }
}
async function setUserBan(userId,ban){
  if(!confirm(`${ban?"Ban":"Unban"} this user?`)) return;
  try{ await api("users/"+userId,{method:"PATCH",body:JSON.stringify({action:ban?"ban":"unban"})}); toast(ban?"User banned":"User restored"); go("users"); }
  catch(e){ toast(e.message); }
}
async function deleteUserAccount(userId,name){
  if(!confirm(`Permanently delete ${name} and their account data?`)) return;
  try{ await api("users/"+userId,{method:"DELETE"}); toast("User deleted"); go("users"); }
  catch(e){ toast(e.message); }
}

async function viewBranding(){
  crumbs([{label:"Branding"}]);
  loading();
  await applyBranding(); // pull the latest saved values from the server
  $c().innerHTML=`<div class="page-head fade"><h1>Branding</h1><p>Set your studio's name, description, logo, and the thumbnail shown in search results and shared links.</p></div>
  <div class="fade">
    <div class="panel">
      <h2>${svg("settings","ic-sm")} Site identity</h2>
      <div class="form-grid">
        <div class="field"><label>Site name</label><input id="brName" value="${esc(SITE.name)}"/></div>
        <div class="field"><label>Tagline</label><input id="brTag" value="${esc(SITE.tagline)}"/></div>
        <div class="field"><label>Description · used by search engines &amp; link previews</label><textarea id="brDesc" style="min-height:90px">${esc(SITE.description)}</textarea></div>
        <div><button class="btn btn-primary" onclick="saveSiteIdentity()">${svg("save","ic-sm")} Save identity</button></div>
      </div>
    </div>
    <div class="panel">
      <h2>${svg("image","ic-sm")} Logo &amp; favicon</h2>
      <p style="color:var(--ink3);font-size:.83rem;margin-top:-.6rem;margin-bottom:1rem">A square image works best (PNG or SVG). Appears in the sidebar, the site header, and as the browser-tab favicon.</p>
      <div class="logo-preview">
        <div class="pv sq"><img id="pvLogo" src="${logoSrc()}" alt="Logo preview"/></div>
        <div style="display:flex;flex-direction:column;gap:.6rem">
          <input type="file" id="logoFile" accept="image/*"/>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="uploadBranding('logo')">${svg("save","ic-sm")} Upload logo</button>
            ${SITE.hasLogo?`<button class="btn btn-ghost btn-sm" onclick="resetBranding('logo')">Use default</button>`:""}
          </div>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>${svg("image","ic-sm")} Search &amp; social thumbnail</h2>
      <p style="color:var(--ink3);font-size:.83rem;margin-top:-.6rem;margin-bottom:1rem">The preview card shown when your site appears in search or is shared on social media. Use a wide 1200×630 image (PNG or JPG) for best results.</p>
      <div class="logo-preview">
        <div class="pv og"><img id="pvOg" src="/api/branding/og?v=${BRAND_V}" alt="Thumbnail preview"/></div>
        <div style="display:flex;flex-direction:column;gap:.6rem">
          <input type="file" id="ogFile" accept="image/*"/>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="uploadBranding('og')">${svg("save","ic-sm")} Upload thumbnail</button>
            ${SITE.hasOg?`<button class="btn btn-ghost btn-sm" onclick="resetBranding('og')">Use default</button>`:""}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
async function saveSiteIdentity(){
  const site={
    name:(document.getElementById("brName").value||"").trim(),
    tagline:(document.getElementById("brTag").value||"").trim(),
    description:(document.getElementById("brDesc").value||"").trim(),
  };
  if(!site.name){ toast("Site name can't be empty"); return; }
  try{
    const r=await api("settings",{method:"PUT",body:JSON.stringify({site})});
    SITE.name=r.site.name; SITE.tagline=r.site.tagline; SITE.description=r.site.description;
    document.title=`${SITE.name} — Digital SAT Practice`;
    const d=document.querySelector('meta[name="description"]'); if(d) d.setAttribute("content",SITE.description);
    toast("Branding saved"); render();
  }catch(e){ toast("Save failed: "+e.message); }
}
async function uploadBranding(kind){
  const input=document.getElementById(kind==="og"?"ogFile":"logoFile");
  const file=input?.files?.[0];
  if(!file){ toast("Choose an image first"); return; }
  if(file.size>2_000_000){ toast("Image too large — keep it under 2 MB"); return; }
  try{
    const token=localStorage.getItem(LS.token);
    const r=await fetch("/api/branding/"+kind,{method:"PUT",
      headers:{"content-type":file.type||"application/octet-stream",...(token?{authorization:"Bearer "+token}:{})},
      body:file});
    if(!r.ok){ let m="Upload failed"; try{m=(await r.json()).error||m}catch{} throw new Error(m); }
    BRAND_V=String(Date.now());
    if(kind==="og") SITE.hasOg=true; else SITE.hasLogo=true;
    toast("Image uploaded"); go("branding");
  }catch(e){ toast(e.message); }
}
async function resetBranding(kind){
  try{
    await api("branding/"+kind,{method:"DELETE"});
    BRAND_V=String(Date.now());
    if(kind==="og") SITE.hasOg=false; else SITE.hasLogo=false;
    toast("Reverted to default"); go("branding");
  }catch(e){ toast("Reset failed: "+e.message); }
}

// ---------- toast ----------
let toastT;
function toast(msg){
  const t=document.getElementById("toast"); t.innerHTML=svg("check","ic-sm")+esc(msg);
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600);
}

// ---------- boot ----------
async function boot(){
  restoreActiveQuiz();
  state.view = state.view || (state.user ? (state.user.role==="admin"?"dashboard":state.user.role==="mentor"?"classes":"home") : "bank");
  await processGoogleCallback();
  await processIdentityCallback();
  // Load KaTeX alongside branding so the very first question already shows real
  // fractions; a CDN hiccup only costs typography, never the question itself.
  await Promise.all([applyBranding(),loadKatex()]);
  render();
  if(state.user) validateSession();
}
boot();
// Re-render on browser back/forward — public and app routes are URL-driven.
window.addEventListener("popstate",()=>render());
</script>
